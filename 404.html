<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08100D"><title>404 — Page Not Found | Ibad Jahangir</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#08100D;--surface:#0F1A15;--text:#F2EEE3;--muted:#A3B0A8;--gold:#F2B84B;--gold-hover:#FFCB6B;--border:rgba(242,238,227,.18);--on-gold:#0A100E}
:root[data-theme=light]{color-scheme:light;--bg:#F6F1E7;--surface:#FBF8F1;--text:#14211C;--muted:#4F5F57;--gold:#8A5A00;--gold-hover:#A66C00;--border:rgba(20,33,28,.22);--on-gold:#14211C}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.65 Inter,Arial,sans-serif;text-align:center;transition:background .25s,color .25s}.wrap{max-width:620px}.code{font:700 clamp(100px,22vw,190px)/.9 'Playfair Display',Georgia,serif;color:var(--gold);letter-spacing:-.09em}.label{font:10px 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--muted);margin:26px 0}h1{font:700 clamp(30px,6vw,48px)/1.15 'Playfair Display',Georgia,serif}p{color:var(--muted);font-size:14px}.theme{position:fixed;top:22px;right:22px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:24px;cursor:pointer;font:12px Inter;min-height:44px}.btn{display:inline-flex;align-items:center;margin-top:24px;padding:14px 20px;background:var(--gold);color:var(--on-gold);text-decoration:none;font-size:12px;font-weight:700;border-radius:5px;min-height:44px}.btn:hover{background:var(--gold-hover)}:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ij-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
</head><body><main class="wrap"><div class="code">404<span>.</span></div><p class="label">PAGE NOT FOUND / ROUTE UNAVAILABLE</p><h1>This page took a wrong turn.</h1><p>The page may have moved, or the address may be incorrect.</p><a class="btn" href="./">Return to homepage ↗</a></main><button class="theme" id="themeToggle" aria-label="Switch to light theme">◐ Theme</button>
<script>const b=document.getElementById('themeToggle');function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('ij-theme',t)}catch(e){}document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#08100D':'#F6F1E7';b.setAttribute('aria-label',t==='dark'?'Switch to light theme':'Switch to dark theme')}b.addEventListener('click',()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark'));theme(document.documentElement.dataset.theme)</script></body></html>
