<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Mathematics and technology workspace</title><desc id="desc">A refined forest-green and gold workspace with a glowing globe, laptop, books and mathematical details.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10281e"/><stop offset=".58" stop-color="#0b1712"/><stop offset="1" stop-color="#1c3026"/></linearGradient>
 <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f6df9b"/><stop offset=".5" stop-color="#c99a43"/><stop offset="1" stop-color="#8a5a20"/></linearGradient>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#17392a"/><stop offset="1" stop-color="#07130e"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#d6ad5e" stop-opacity=".35"/><stop offset="1" stop-color="#d6ad5e" stop-opacity="0"/></radialGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="760" rx="34" fill="url(#bg)"/>
<circle cx="305" cy="290" r="280" fill="url(#glow)"/>
<path d="M0 620 Q330 580 610 620 T1200 600 V760 H0Z" fill="#07110d" opacity=".65"/>
<path d="M0 628 Q350 595 700 630 T1200 615" fill="none" stroke="#b68b43" stroke-opacity=".35"/>
<!-- globe -->
<circle cx="300" cy="260" r="150" fill="#071b14" stroke="url(#gold)" stroke-width="5"/>
<circle cx="300" cy="260" r="132" fill="none" stroke="#c7a35c" stroke-opacity=".4"/>
<ellipse cx="300" cy="260" rx="66" ry="150" fill="none" stroke="#c7a35c" stroke-opacity=".5"/>
<ellipse cx="300" cy="260" rx="150" ry="55" fill="none" stroke="#c7a35c" stroke-opacity=".5"/>
<path d="M170 230 Q240 190 290 225 T430 250 M178 290 Q250 330 310 290 T420 285 M245 120 Q280 185 260 260 T285 400 M355 120 Q320 190 345 260 T325 400" fill="none" stroke="#8eb29b" stroke-opacity=".45" stroke-width="2"/>
<path d="M150 240 C210 40 440 80 455 250 C470 420 230 490 150 240Z" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity=".8"/>
<circle cx="450" cy="250" r="6" fill="#f5d78e"/>
<path d="M245 415h110l25 35H220Z" fill="#18271f" stroke="url(#gold)" stroke-width="3"/>
<!-- books -->
<g font-family="Georgia,serif">
 <rect x="70" y="500" width="360" height="54" rx="5" fill="#142d22" stroke="#a87c37"/><text x="98" y="535" fill="#e3c27b" font-size="24">π  MATHEMATICS</text>
 <rect x="90" y="558" width="365" height="54" rx="5" fill="#10251c" stroke="#a87c37"/><text x="118" y="593" fill="#e3c27b" font-size="23">✳  ARTIFICIAL INTELLIGENCE</text>
 <rect x="112" y="616" width="370" height="54" rx="5" fill="#173326" stroke="#a87c37"/><text x="140" y="651" fill="#e3c27b" font-size="23">&lt;/&gt;  SOFTWARE DEVELOPMENT</text>
</g>
<!-- laptop -->
<ellipse cx="810" cy="675" rx="340" ry="26" fill="#000" opacity=".55" filter="url(#shadow)"/>
<path d="M570 250 Q570 225 598 220 L1070 185 Q1092 184 1092 210 V550 H570Z" fill="#070b09" stroke="url(#gold)" stroke-width="4"/>
<rect x="592" y="242" width="478" height="282" rx="5" fill="url(#screen)"/>
<path d="M615 450 C740 360 830 510 1048 340" fill="none" stroke="#3f9a70" stroke-width="20" opacity=".35"/>
<path d="M615 455 C740 365 830 515 1048 345" fill="none" stroke="url(#gold)" stroke-width="4"/>
<text x="830" y="320" text-anchor="middle" fill="#ead9ae" font-family="Georgia,serif" font-size="30" font-style="italic">Build · Innovate · Inspire</text>
<text x="830" y="425" text-anchor="middle" fill="url(#gold)" font-family="monospace" font-size="88" font-weight="bold">&lt;/&gt;</text>
<path d="M550 550 H1110 L1160 605 Q1165 617 1140 620 H510 Q485 617 495 604Z" fill="#18231d" stroke="url(#gold)" stroke-width="3"/>
<path d="M700 565h250l-18 24H720Z" fill="#0a120e" stroke="#7f714d"/>
<!-- pi ornament -->
<text x="1060" y="570" fill="url(#gold)" font-family="Georgia,serif" font-size="105">π</text>
<g fill="#e4c77e" font-family="monospace" font-size="15" letter-spacing="3"><text x="70" y="90">IDEAS INTO DIGITAL PRODUCTS</text><text x="890" y="705">AI / SOFTWARE / DATA</text></g>
<path d="M70 110h170 M890 680h220" stroke="#c59b4e" stroke-opacity=".7"/>
</svg>